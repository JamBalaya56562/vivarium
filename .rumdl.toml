[global]
include = [
  "docs/site/**/*.md",
  "AGENTS.md",
  "CLAUDE.md",
  "README.md",
  "**/*.md",
]

exclude = [
  ".git",
  ".github",
  "node_modules",
  "vendor",
  "dist",
  "build",
  "doc_build",
  ".venv",
  "target",
  "_context",
  "src/**/node_modules/**",
  "**/CHANGELOG.md",
  "**/LICENSE.md",
  "**/node_modules/**",
]

disable = ["MD013", "MD033", "MD036", "MD041", "MD057"]

respect-gitignore = true

flavor = "gfm"

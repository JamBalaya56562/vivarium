version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "type: chore"
      - "scope: ci"
    commit-message:
      prefix: "chore(actions)"
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directories:
      - "/src/layer2_docker/*"
    schedule:
      interval: "daily"
    labels:
      - "type: chore"
      - "scope: docker"
    commit-message:
      prefix: "chore(docker)"
    groups:
      layer2-base-images:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: "terraform"
    directory: "/infra/github"
    schedule:
      interval: "daily"
    labels:
      - "type: chore"
      - "scope: infra"
    commit-message:
      prefix: "chore(infra)"
    groups:
      terraform-providers:
        patterns:
          - "*"

  - package-ecosystem: "bun"
    directory: "/packages/mcp-server"
    schedule:
      interval: "daily"
    labels:
      - "type: chore"
      - "scope: js"
    commit-message:
      prefix: "chore(deps)"
    groups:
      mcp-server-deps:
        patterns:
          - "*"

  - package-ecosystem: "bun"
    directory: "/docs"
    schedule:
      interval: "daily"
    labels:
      - "type: chore"
      - "scope: js"
      - "scope: docs"
    commit-message:
      prefix: "chore(deps)"
    groups:
      docs-deps:
        patterns:
          - "*"

  - package-ecosystem: "bun"
    directory: "/src/layer1_wasm"
    schedule:
      interval: "daily"
    labels:
      - "type: chore"
      - "scope: js"
      - "scope: wasm"
    commit-message:
      prefix: "chore(deps)"
    groups:
      layer1-deps:
        patterns:
          - "*"

name: Test polyglot lint

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-lint-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Polyglot lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install: true
          cache: true
          experimental: true

      - name: Ensure Rust components and target (mise post-install)
        run: |
          rustup component add rustfmt clippy
          rustup target add wasm32-wasip1

      - name: Run polyglot lint
        run: mise run lint:all

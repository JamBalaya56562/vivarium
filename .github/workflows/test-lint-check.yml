name: Test polyglot lint

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**/*.ts'
      - 'docs/**/*.tsx'
      - 'docs/**/*.js'
      - 'docs/**/*.mjs'
      - 'docs/**/*.cjs'
      - 'docs/**/*.css'
      - 'docs/**/*.json'
      - 'docs/biome.json'
      - 'docs/package.json'
      - 'docs/bun.lock'
      - 'src/layer1_wasm/**/*.php'
      - 'src/layer1_wasm/**/*.py'
      - 'src/layer1_wasm/**/*.rs'
      - 'src/layer1_wasm/**/Cargo.toml'
      - 'src/layer1_wasm/**/Cargo.lock'
      - 'docs/scripts/**/*.py'
      - '**/*.toml'
      - '**/*.md'
      - 'mago.toml'
      - 'ruff.toml'
      - 'tombi.toml'
      - '.rumdl.toml'
      - 'mise.toml'
      - '.github/workflows/test-lint-check.yml'

permissions:
  contents: read

concurrency:
  group: test-lint-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Polyglot lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true
          experimental: true

      - name: Ensure Rust components and target (mise post-install)
        run: |
          rustup component add rustfmt clippy
          rustup target add wasm32-wasip1

      - name: Run polyglot lint
        run: mise run ci:lint

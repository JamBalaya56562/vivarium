name: Tofu fmt autofix

on:
  pull_request_target:
    paths:
      - 'infra/github/**'
      - '.github/workflows/tofu-fmt-autofix.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  autofix:
    if: github.repository_owner == 'aletheia-works'
    uses: aletheia-works/.github/.github/workflows/terraform-autofix.yml@ffd7b8b9619fe8da13233a21c920b4d56b126f28 # main
    with:
      working_directory: infra/github
      commit_message: 'style(infra): tofu fmt -recursive'
    secrets: inherit

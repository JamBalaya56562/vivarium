name: Terraform State Backup

on:
  schedule:
    - cron: '0 3 * * 1'

  workflow_run:
    workflows: ["Terraform Apply"]
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  backup:
    if: |
      github.repository_owner == 'aletheia-works' &&
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.conclusion == 'success')
    uses: aletheia-works/.github/.github/workflows/terraform-state-backup.yml@f8efae13d9ff4ea96692f7feac3cfdc4a7add308 # main
    with:
      working_directory: infra/github
    secrets:
      TF_TOKEN_GITHUB: ${{ secrets.TF_TOKEN_GITHUB }}

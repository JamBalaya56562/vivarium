name: repro-regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repro-regression-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  runtime-bump:
    name: bump Layer 1 runtimes
    if: >-
      github.repository_owner == 'aletheia-works' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRANCH: chore/bump-layer1-runtimes
      TITLE: 'chore(wasm): bump layer 1 runtimes'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.TF_TOKEN_GITHUB }}
          persist-credentials: true

      - name: Setup mise (bun)
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install: true
          cache: true
          experimental: true
          install_args: bun

      - name: Move runtime pins to their latest releases
        id: bump
        run: |
          set -euo pipefail
          mise run repro:runtimes:bump > "${RUNNER_TEMP}/bump.md"
          if git diff --quiet; then
            echo "Every Layer 1 runtime pin is already on its latest release."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            cat "${RUNNER_TEMP}/bump.md" >> "${GITHUB_STEP_SUMMARY}"
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Open or update the bump pull request
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.TF_TOKEN_GITHUB }}
        run: |
          set -euo pipefail
          {
            cat "${RUNNER_TEMP}/bump.md"
            echo
            echo "This pull request's own repro-regression run re-checks every Layer 1 recipe on the new runtimes. A recipe whose verdict flips is a result, not a breakage: the bundled library or the runtime changed underneath it."
          } > "${RUNNER_TEMP}/body.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "${BRANCH}"
          git commit -am "${TITLE}"
          git push --force origin "HEAD:${BRANCH}"
          if [ "$(gh pr view "${BRANCH}" --json state --jq .state 2>/dev/null || true)" = "OPEN" ]; then
            gh pr edit "${BRANCH}" --title "${TITLE}" --body-file "${RUNNER_TEMP}/body.md"
          else
            gh pr create --base main --head "${BRANCH}" --title "${TITLE}" --body-file "${RUNNER_TEMP}/body.md"
          fi

  regression:
    name: regression (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: src/layer1_wasm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise (bun, jsonschema)
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install: true
          cache: true
          experimental: true
          install_args: bun jq jsonschema

      - name: Validate external manifest examples (manifest v1)
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          manifests=(src/external_examples/*/.vivarium/manifest.toml)
          if [ ${#manifests[@]} -eq 0 ]; then
            echo "No src/external_examples/*/.vivarium/manifest.toml; skipping."
            exit 0
          fi
          schema="docs/site/public/spec/manifest.schema.json"
          if [ ! -f "$schema" ]; then
            echo "::error::Manifest schema missing at ${schema}"
            exit 1
          fi
          fail=0
          tmp_json="$(mktemp --suffix=.json)"
          trap 'rm -f "$tmp_json"' EXIT
          for manifest in "${manifests[@]}"; do
            example="$(basename "$(dirname "$(dirname "$manifest")")")"
            echo "Validating ${example}: ${manifest}"
            python3 -c "import json, sys, tomllib; sys.stdout.write(json.dumps(tomllib.load(open(sys.argv[1], 'rb'))))" "$manifest" > "$tmp_json"
            if ! jsonschema validate --format-assertion "$schema" "$tmp_json"; then
              echo "::error::Manifest validation failed for ${example} (${manifest})"
              fail=$((fail + 1))
            fi
          done
          if [ "$fail" -gt 0 ]; then
            echo "::error::${fail} external manifest example(s) failed schema validation."
            exit 1
          fi
          echo "All ${#manifests[@]} external manifest example(s) validated against manifest v1 schema."

      - name: Type-check + build Layer 1 (TS + Rust wasm)
        working-directory: ${{ github.workspace }}
        run: |
          mise run repro:typecheck
          mise run repro:build
          mise run repro:i18n

      - name: Build, run, and snapshot Layer 2 Docker reproductions (no push)
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dockerfile in src/layer2_docker/*/Dockerfile; do
            slug_dir="$(dirname "$dockerfile")"
            slug="$(basename "$slug_dir")"
            case "$slug" in _*) continue ;; esac
            tag="vivarium-${slug}:test"
            echo "Building Layer 2 image for regression: ${slug}"
            docker build --tag "$tag" "$slug_dir"

            mise run verdict:capture-layer2 \
              "$tag" \
              "${slug_dir}/verdict.json"

            verdict=$(jq -r '.verdict' "${slug_dir}/verdict.json")
            exit_code=$(jq -r '.exit_code' "${slug_dir}/verdict.json")

            if [ "$exit_code" -ne 0 ]; then
              echo "::warning::Layer 2 reproduction ${slug} exited ${exit_code}; downstream Playwright step will assert verdict expectations"
            fi
            echo "Layer 2 reproduction ${slug}: verdict=${verdict} (exit ${exit_code})"
          done

      - name: Detect Layer 2 verdict drift vs deployed Pages snapshot
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          drift=0
          checked=0
          tmp_deployed="$(mktemp)"
          trap 'rm -f "$tmp_deployed"' EXIT

          for vf in src/layer2_docker/*/verdict.json; do
            slug="$(basename "$(dirname "$vf")")"
            case "$slug" in _*) continue ;; esac
            captured=$(jq -r '.verdict' "$vf")
            url="$(jq -r --arg s "$slug" \
              '.recipes[] | select(.slug == $s) | .verdict_url' \
              docs/site/public/api/recipes.json)"
            if [ -z "$url" ] || [ "$url" = "null" ]; then
              echo "::warning::Layer 2 ${slug}: not present in recipes.json or has no verdict_url — skipped"
              continue
            fi

            http_status=$(curl -sS \
              --connect-timeout 5 \
              --max-time 15 \
              --retry 2 \
              --retry-delay 2 \
              -o "$tmp_deployed" \
              -w '%{http_code}' \
              "$url" || echo "000")

            case "$http_status" in
              200)
                checked=$((checked + 1))
                if ! deployed=$(jq -r '.verdict' "$tmp_deployed" 2>/dev/null); then
                  echo "::warning::Layer 2 ${slug}: deployed snapshot at ${url} is not valid JSON — skipped"
                  continue
                fi
                if [ "$captured" != "$deployed" ]; then
                  echo "::error::Layer 2 verdict drift on ${slug}: deployed=${deployed} captured=${captured} (see ${url})"
                  drift=$((drift + 1))
                else
                  echo "Layer 2 ${slug}: deployed=${deployed} captured=${captured} (no drift)"
                fi
                ;;
              404)
                echo "Layer 2 ${slug}: no deployed snapshot at ${url} (new recipe?) — skipped"
                ;;
              000)
                echo "::warning::Layer 2 ${slug}: deployed snapshot fetch failed (DNS/timeout/network) — skipped"
                ;;
              *)
                echo "::warning::Layer 2 ${slug}: deployed snapshot fetch returned HTTP ${http_status} — skipped (transient)"
                ;;
            esac
          done

          echo "Layer 2 drift check: ${checked} recipe(s) compared, ${drift} drift(s) detected."
          if [ "$drift" -gt 0 ]; then
            echo "::error::${drift} Layer 2 recipe(s) drifted from their deployed verdict — upstream/runtime appears to have changed since the last green main deploy. Investigate (recipe regression vs upstream-fix-detected) and either update the recipe or accept the new verdict by re-deploying."
            exit 1
          fi

      - name: Install Playwright browser (${{ matrix.browser }})
        run: bunx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright regression suite (${{ matrix.browser }})
        run: bun run test -- --project=${{ matrix.browser }}
        env:
          CI: 'true'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.browser }}-${{ github.run_id }}
          path: src/layer1_wasm/playwright-report/
          retention-days: 14

name: repro-regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repro-regression-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  runtime-bump:
    name: bump Layer 1 runtimes
    if: >-
      github.repository_owner == 'aletheia-works' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get an aletheia-works-bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise (bun)
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install: true
          cache: true
          experimental: true
          install_args: bun

      - name: Move runtime pins to their latest releases
        id: bump
        env:
          BUMP_TITLE_FILE: ${{ runner.temp }}/title.txt
        run: |
          set -euo pipefail
          (cd src/layer1_wasm && bun run scripts/bump-runtimes.ts) > "${RUNNER_TEMP}/bump.md"
          if git diff --quiet; then
            echo "Every Layer 1 runtime pin is already on its latest release."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          cat "${RUNNER_TEMP}/bump.md" >> "${GITHUB_STEP_SUMMARY}"
          echo "title=$(cat "${BUMP_TITLE_FILE}")" >> "${GITHUB_OUTPUT}"
          {
            cat "${RUNNER_TEMP}/bump.md"
            echo
            echo "This pull request's own repro-regression run re-checks every Layer 1 recipe on the new runtimes, and the pull request merges itself once the required checks pass. A recipe whose verdict flips is a result, not a breakage: the bundled library or the runtime changed underneath it."
          } > "${RUNNER_TEMP}/body.md"
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Open or update the bump pull request
        if: steps.bump.outputs.changed == 'true'
        uses: ./.github/actions/bot-pull-request
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/bump-layer1-runtimes
          title: ${{ steps.bump.outputs.title }}
          body-path: ${{ runner.temp }}/body.md
  regression:
    name: regression (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: src/layer1_wasm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise (bun, jsonschema)
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install: true
          cache: true
          experimental: true
          install_args: bun jq jsonschema

      - name: Validate external manifest examples (manifest v1)
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          manifests=(src/external_examples/*/.vivarium/manifest.toml)
          if [ ${#manifests[@]} -eq 0 ]; then
            echo "No src/external_examples/*/.vivarium/manifest.toml; skipping."
            exit 0
          fi
          schema="docs/site/public/spec/manifest.schema.json"
          if [ ! -f "$schema" ]; then
            echo "::error::Manifest schema missing at ${schema}"
            exit 1
          fi
          fail=0
          tmp_json="$(mktemp --suffix=.json)"
          trap 'rm -f "$tmp_json"' EXIT
          for manifest in "${manifests[@]}"; do
            example="$(basename "$(dirname "$(dirname "$manifest")")")"
            echo "Validating ${example}: ${manifest}"
            python3 -c "import json, sys, tomllib; sys.stdout.write(json.dumps(tomllib.load(open(sys.argv[1], 'rb'))))" "$manifest" > "$tmp_json"
            if ! jsonschema validate --format-assertion "$schema" "$tmp_json"; then
              echo "::error::Manifest validation failed for ${example} (${manifest})"
              fail=$((fail + 1))
            fi
          done
          if [ "$fail" -gt 0 ]; then
            echo "::error::${fail} external manifest example(s) failed schema validation."
            exit 1
          fi
          echo "All ${#manifests[@]} external manifest example(s) validated against manifest v1 schema."

      - name: Type-check + build Layer 1 (TS + Rust wasm)
        working-directory: ${{ github.workspace }}
        run: |
          mise run repro:typecheck
          mise run repro:build
          mise run repro:i18n

      - name: Stage formicarium assets (pin mode)
        working-directory: ${{ github.workspace }}
        timeout-minutes: 7
        run: bun docs/scripts/stage-formicarium-assets.ts --mode pin

      # The type check needs the pinned tarball itself; without it the test
      # skips as NOT MEASURED, so fetch the pinned version and check its digest.
      - name: Check the formicarium types against the pinned tarball
        working-directory: ${{ github.workspace }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          pin=src/layer1_wasm/formicarium.pin.json
          version="$(jq -r .packageVersion "$pin")"
          expected="$(jq -r .tarballSha256 "$pin")"
          dir="${RUNNER_TEMP}/formicarium-tarball"
          mkdir -p "$dir"
          npm pack "@aletheia-works/formicarium@${version}" --pack-destination "$dir" --silent
          tarball="${dir}/aletheia-works-formicarium-${version}.tgz"
          echo "${expected}  ${tarball}" | sha256sum --check --strict
          FORMICARIUM_LOCAL_TARBALL="$tarball" bun test docs/scripts/__tests__/formicariumTypes.test.ts

      - name: Build, run, and snapshot Layer 2 Docker reproductions (no push)
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dockerfile in src/layer2_docker/*/Dockerfile; do
            slug_dir="$(dirname "$dockerfile")"
            slug="$(basename "$slug_dir")"
            case "$slug" in _*) continue ;; esac
            tag="vivarium-${slug}:test"
            echo "Building Layer 2 image for regression: ${slug}"
            docker build --tag "$tag" "$slug_dir"

            mise run verdict:capture-layer2 \
              "$tag" \
              "${slug_dir}/verdict.json"

            verdict=$(jq -r '.verdict' "${slug_dir}/verdict.json")
            exit_code=$(jq -r '.exit_code' "${slug_dir}/verdict.json")

            if [ "$exit_code" -ne 0 ]; then
              echo "::warning::Layer 2 reproduction ${slug} exited ${exit_code}; downstream Playwright step will assert verdict expectations"
            fi
            echo "Layer 2 reproduction ${slug}: verdict=${verdict} (exit ${exit_code})"
          done

      - name: Detect Layer 2 verdict drift vs deployed Pages snapshot
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          drift=0
          checked=0
          tmp_deployed="$(mktemp)"
          trap 'rm -f "$tmp_deployed"' EXIT

          for vf in src/layer2_docker/*/verdict.json; do
            slug="$(basename "$(dirname "$vf")")"
            case "$slug" in _*) continue ;; esac
            captured=$(jq -r '.verdict' "$vf")
            url="$(jq -r --arg s "$slug" \
              '.recipes[] | select(.slug == $s) | .verdict_url' \
              docs/site/public/api/recipes.json)"
            if [ -z "$url" ] || [ "$url" = "null" ]; then
              echo "::warning::Layer 2 ${slug}: not present in recipes.json or has no verdict_url — skipped"
              continue
            fi

            http_status=$(curl -sS \
              --connect-timeout 5 \
              --max-time 15 \
              --retry 2 \
              --retry-delay 2 \
              -o "$tmp_deployed" \
              -w '%{http_code}' \
              "$url" || echo "000")

            case "$http_status" in
              200)
                checked=$((checked + 1))
                if ! deployed=$(jq -r '.verdict' "$tmp_deployed" 2>/dev/null); then
                  echo "::warning::Layer 2 ${slug}: deployed snapshot at ${url} is not valid JSON — skipped"
                  continue
                fi
                if [ "$captured" != "$deployed" ]; then
                  echo "::error::Layer 2 verdict drift on ${slug}: deployed=${deployed} captured=${captured} (see ${url})"
                  drift=$((drift + 1))
                else
                  echo "Layer 2 ${slug}: deployed=${deployed} captured=${captured} (no drift)"
                fi
                ;;
              404)
                echo "Layer 2 ${slug}: no deployed snapshot at ${url} (new recipe?) — skipped"
                ;;
              000)
                echo "::warning::Layer 2 ${slug}: deployed snapshot fetch failed (DNS/timeout/network) — skipped"
                ;;
              *)
                echo "::warning::Layer 2 ${slug}: deployed snapshot fetch returned HTTP ${http_status} — skipped (transient)"
                ;;
            esac
          done

          echo "Layer 2 drift check: ${checked} recipe(s) compared, ${drift} drift(s) detected."
          if [ "$drift" -gt 0 ]; then
            echo "::error::${drift} Layer 2 recipe(s) drifted from their deployed verdict — upstream/runtime appears to have changed since the last green main deploy. Investigate (recipe regression vs upstream-fix-detected) and either update the recipe or accept the new verdict by re-deploying."
            exit 1
          fi

      - name: Install Playwright browser (${{ matrix.browser }})
        uses: aletheia-works/.github/actions/install-playwright@237aeceec82d1ac86155fae871a80d4c1b436845 # v1.2.0
        with:
          browsers: ${{ matrix.browser }}
          command: bunx playwright
          working-directory: src/layer1_wasm

      - name: Run Playwright regression suite (${{ matrix.browser }})
        run: bun run test -- --project=${{ matrix.browser }}
        env:
          CI: 'true'
          U6_COVERAGE_DIR: ${{ matrix.browser == 'chromium' && format('{0}/u6-v8', runner.temp) || '' }}

      - name: U6 line coverage (bun + Chromium V8, fixed denominator)
        if: matrix.browser == 'chromium'
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          bun test --coverage --coverage-reporter=lcov --coverage-dir="${RUNNER_TEMP}/u6-bun" \
            docs/scripts/__tests__/recipesIndex.test.ts \
            docs/scripts/__tests__/stageFormicariumAssets.test.ts \
            docs/scripts/__tests__/coiServiceWorkerPin.test.ts \
            src/layer1_wasm/biome-migrate-override-bracket-spacing/verdict.test.ts \
            src/layer1_wasm/_shared/_test/formicarium_terminal.test.ts
          mkdir -p "${RUNNER_TEMP}/u6-coverage"
          cp "${RUNNER_TEMP}/u6-bun/lcov.info" "${RUNNER_TEMP}/u6-coverage/bun-lcov.info"
          bun src/layer1_wasm/scripts/u6-coverage.ts \
            --lcov "${RUNNER_TEMP}/u6-bun/lcov.info" \
            --v8 "${RUNNER_TEMP}/u6-v8" \
            --out "${RUNNER_TEMP}/u6-coverage"

      - name: Upload U6 coverage
        if: always() && matrix.browser == 'chromium'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: u6-coverage-${{ github.run_id }}
          path: ${{ runner.temp }}/u6-coverage/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.browser }}-${{ github.run_id }}
          path: src/layer1_wasm/playwright-report/
          retention-days: 14

name: publish-mcp

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish or resume (e.g. v0.2.2)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-mcp-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to JSR + npm
    if: github.repository == 'aletheia-works/vivarium'
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/mcp-server
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Setup mise (bun, node)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install: true
          cache: true
          experimental: true
          install_args: bun node

      - name: Install + build + test
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run test

      - name: Validate release and check both registries
        id: release
        run: bun run check:version --registries

      - name: Publish to npm (provenance via OIDC trusted publishing, npm CLI run through bunx)
        if: steps.release.outputs.npm_skip == 'false'
        # Bun cannot publish over OIDC (oven-sh/bun#15601), and older npm
        # minors mask trusted-publishing failures as ENEEDAUTH (npm/cli#9088).
        run: bunx npm@latest publish --provenance --access public
        env:
          NPM_CONFIG_REGISTRY: 'https://registry.npmjs.org/'

      - name: Publish to JSR (provenance via OIDC)
        if: steps.release.outputs.jsr_skip == 'false'
        run: bunx jsr publish

      - name: Summary
        run: |
          {
            echo "## Release $RELEASE_TAG"
            echo ""
            echo "* **npm**: https://www.npmjs.com/package/@aletheia-works/vivarium-mcp"
            echo "* **JSR**: https://jsr.io/@aletheia-works/vivarium-mcp"
            echo ""
            echo "npm already published: ${{ steps.release.outputs.npm_skip }}"
            echo "JSR already published: ${{ steps.release.outputs.jsr_skip }}"
          } >> "$GITHUB_STEP_SUMMARY"

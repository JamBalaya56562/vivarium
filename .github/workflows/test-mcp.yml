name: Test MCP

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test MCP server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mcp-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise (bun, node)
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: true
          cache: true
          experimental: true
          install_args: bun node

      - name: Install + test
        run: |
          bun install --frozen-lockfile
          bun run test

      - name: Verify the installed npm package and the JSR dry run
        run: |
          bun run build
          bun run verify:package

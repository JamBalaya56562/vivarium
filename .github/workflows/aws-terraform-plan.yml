name: AWS Terraform Plan

on:
  pull_request_target:
    paths:
      - 'infra/aws/**'
      - 'src/layer3_previews/**'
      - '.github/workflows/aws-terraform-plan.yml'

permissions:
  contents: read
  pull-requests: write
  actions: read
  id-token: write

concurrency:
  group: aws-terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # pull_request_target hands the plan role and the state passphrase to the
  # PR's own configuration, so only a PR from a writer may run it.
  authorize:
    name: Authorize the plan
    if: github.repository == 'aletheia-works/vivarium'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - name: Check who opened the PR
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            if (pr.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`) {
              core.setOutput('allowed', 'true');
              return;
            }
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: pr.user.login,
            });
            const allowed = ['admin', 'maintain', 'write'].includes(data.role_name);
            if (!allowed) {
              core.notice(`Skipping the plan: ${pr.user.login} has ${data.role_name} access, and a PR from a fork needs write access to run it.`);
            }
            core.setOutput('allowed', String(allowed));

  plan:
    name: OpenTofu Plan (infra/aws)
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TOFU_PLAN_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Setup mise (opentofu)
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install: true
          cache: true
          experimental: true
          install_args: opentofu

      - name: Configure state encryption
        env:
          TF_STATE_PASSPHRASE: ${{ secrets.TF_STATE_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [[ ! "${TF_STATE_PASSPHRASE}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::TF_STATE_PASSPHRASE must be 64 lowercase hex characters (openssl rand -hex 32)."
            exit 1
          fi
          {
            echo 'TF_ENCRYPTION<<TF_ENCRYPTION_EOF'
            cat <<EOF
          key_provider "pbkdf2" "state" {
            passphrase = "${TF_STATE_PASSPHRASE}"
          }
          method "aes_gcm" "state" {
            keys = key_provider.pbkdf2.state
          }
          state {
            method = method.aes_gcm.state
          }
          EOF
            echo 'TF_ENCRYPTION_EOF'
          } >> "$GITHUB_ENV"

      - name: Download state artifact
        if: vars.LATEST_AWS_APPLY_RUN_ID != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: terraform-state-aws
          path: infra/aws/
          run-id: ${{ vars.LATEST_AWS_APPLY_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - run: tofu init -input=false -lockfile=readonly
      - run: tofu validate

      - name: Tofu Plan
        id: plan
        env:
          TF_VAR_preview_github_client_id: ${{ vars.PREVIEW_GITHUB_CLIENT_ID }}
          TF_VAR_preview_github_client_secret: ${{ secrets.PREVIEW_GITHUB_CLIENT_SECRET }}
        run: |
          set +e
          tofu plan -input=false -no-color -lock=false > plan_output.txt 2>&1
          code=$?
          set -e
          cat plan_output.txt
          exit "$code"
        continue-on-error: true

      - name: Post plan to the PR
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAN_STATUS: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const path = 'infra/aws/plan_output.txt';
            const output = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : '(plan_output.txt was not produced; see the run)';
            const max = 60000;
            const text = output.length > max ? `${output.slice(0, max)}\n\n...(output truncated)...` : output;
            const marker = '<!-- tofu-plan:infra/aws -->';
            const status = process.env.PLAN_STATUS === 'success' ? '✅ Ready to apply' : '❌ Failed';
            const body = [
              '## 📋 OpenTofu Plan Result (`infra/aws`)',
              '',
              `Plan: ${status}`,
              '',
              '<details><summary>📄 Plan Output</summary>',
              '',
              '```terraform',
              text,
              '```',
              '',
              '</details>',
              '',
              `*Commit: ${context.payload.pull_request.head.sha.slice(0, 7)}*`,
              marker,
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if the plan failed
        if: steps.plan.outcome != 'success'
        run: exit 1

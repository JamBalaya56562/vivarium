name: Test fixed guest builder

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-fixed-guest-builder-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Test fixed guest builder
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/fixed-guest-builder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise (bun)
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install: true
          cache: true
          experimental: true
          install_args: bun

      - name: Install, type-check and test (line coverage at least 80%)
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test

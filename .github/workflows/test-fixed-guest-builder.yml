name: Test fixed guest builder

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test fixed guest builder
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/fixed-guest-builder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise (bun)
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install: true
          cache: true
          experimental: true
          install_args: bun

      - name: Install, type-check and test (line coverage at least 80%)
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test

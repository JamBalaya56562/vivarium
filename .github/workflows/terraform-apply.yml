name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - 'infra/github/**'
      - '.github/workflows/terraform-apply.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  apply:
    if: github.repository_owner == 'aletheia-works'
    uses: aletheia-works/.github/.github/workflows/terraform-apply.yml@4f9b6d6865f083952f13557c91eaf839045e55e1 # v1.0.0
    with:
      working_directory: infra/github
      tfvar_assignments: |
        create_phase_milestones=true
    secrets: inherit

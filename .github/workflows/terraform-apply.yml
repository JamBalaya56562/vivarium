name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - 'infra/github/**'
      - '.github/workflows/terraform-apply.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  apply:
    if: github.repository_owner == 'aletheia-works'
    uses: aletheia-works/.github/.github/workflows/terraform-apply.yml@f8efae13d9ff4ea96692f7feac3cfdc4a7add308 # main
    with:
      working_directory: infra/github
      tfvar_assignments: |
        create_phase_milestones=true
    secrets: inherit

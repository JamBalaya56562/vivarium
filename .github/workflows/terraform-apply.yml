name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - 'infra/github/**'
      - '.github/workflows/terraform-apply.yml'
  workflow_dispatch:

concurrency:
  group: terraform-state
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  apply:
    if: github.repository_owner == 'aletheia-works'
    uses: aletheia-works/.github/.github/workflows/terraform-apply.yml@ffd7b8b9619fe8da13233a21c920b4d56b126f28 # main
    with:
      working_directory: infra/github
      tfvar_assignments: |
        create_phase_milestones=true
    secrets: inherit

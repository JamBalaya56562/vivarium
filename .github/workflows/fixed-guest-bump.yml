name: fixed-guest-bump

run-name: bump ${{ inputs.role }} in ${{ inputs.recipe }}

on:
  workflow_dispatch:
    inputs:
      recipe:
        description: Path of the recipe.json under src/layer1_wasm
        required: true
        type: string
      role:
        description: Which guest of the recipe to move
        required: true
        type: choice
        options:
          - baseline
          - fix

permissions:
  contents: read
  actions: read

concurrency:
  group: fixed-guest-bump
  cancel-in-progress: false

jobs:
  bump:
    name: bump ${{ inputs.role }}
    if: github.repository == 'aletheia-works/vivarium' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RECIPE: ${{ inputs.recipe }}
      ROLE: ${{ inputs.role }}
    steps:
      - name: Refuse a recipe path outside src/layer1_wasm
        run: |
          set -euo pipefail
          case "${RECIPE}" in
            *..*) echo "recipe path must not contain .." >&2; exit 1 ;;
          esac
          if ! printf '%s' "${RECIPE}" | grep -Eq '^src/layer1_wasm/[A-Za-z0-9_./-]+/recipe\.json$'; then
            echo "recipe path must be src/layer1_wasm/.../recipe.json" >&2
            exit 1
          fi
          case "${ROLE}" in
            baseline|fix) ;;
            *) echo "role must be baseline or fix" >&2; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise (bun)
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install: true
          cache: true
          experimental: true
          install_args: bun

      - name: Install the builder's locked dependencies
        working-directory: tools/fixed-guest-builder
        run: bun install --frozen-lockfile

      - name: Move the guest to the branch tip
        id: bump
        working-directory: tools/fixed-guest-builder
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bun run src/cli.ts bump \
            --workflow fixed-guest-bump.yml \
            --recipe "${GITHUB_WORKSPACE}/${RECIPE}" \
            --role "${ROLE}" \
            --work "${RUNNER_TEMP}/fgb-bump" > "${RUNNER_TEMP}/bump.json"
          changed=$(bun -e 'console.log((await Bun.file(process.argv[1]).json()).changed)' "${RUNNER_TEMP}/bump.json")
          echo "changed=${changed}" >> "${GITHUB_OUTPUT}"
          slug=$(basename "$(dirname "${RECIPE}")")
          echo "slug=${slug}" >> "${GITHUB_OUTPUT}"
          echo "branch=fixed-guest-bump/${slug}-${ROLE}" >> "${GITHUB_OUTPUT}"
          {
            echo "Moves the ${ROLE} guest in \`${RECIPE}\` to the tip of the branch its declaration names."
            echo "Only its commit moves; its accepted build stays until a person accepts the new build."
            echo
            echo "The commit was resolved with \`git ls-remote\` against the declared repository and"
            echo "checked to be reachable from that repository's own refs. PR pages were not used."
            echo
            echo '```json'
            cat "${RUNNER_TEMP}/bump.json"
            echo '```'
            echo
            echo "It merges itself once the required checks pass. The fixed build for the new key runs separately."
          } > "${RUNNER_TEMP}/body.md"

      - name: Get an aletheia-works-bot token
        if: steps.bump.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update the pull request
        if: steps.bump.outputs.changed == 'true'
        uses: ./.github/actions/bot-pull-request
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ steps.bump.outputs.branch }}
          title: 'chore(layer1): bump the ${{ inputs.role }} guest of ${{ steps.bump.outputs.slug }}'
          body-path: ${{ runner.temp }}/body.md

name: formicarium-bump

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formicarium-bump
  cancel-in-progress: false

jobs:
  bump:
    name: bump the formicarium pin
    if: github.repository_owner == 'aletheia-works' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise (bun, jq)
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install: true
          cache: true
          experimental: true
          install_args: bun jq

      - name: Move the pin to the latest release
        id: bump
        run: |
          set -euo pipefail
          bun docs/scripts/generate-formicarium-pin.ts > "${RUNNER_TEMP}/bump.md"
          if git diff --quiet; then
            echo "The formicarium pin is on the latest release."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          cat "${RUNNER_TEMP}/bump.md" >> "${GITHUB_STEP_SUMMARY}"
          echo "title=chore(wasm): bump formicarium to $(jq -r .packageVersion src/layer1_wasm/formicarium.pin.json)" >> "${GITHUB_OUTPUT}"
          {
            cat "${RUNNER_TEMP}/bump.md"
            echo
            echo "Every digest above was read from the tarball the npm registry serves, checked against the registry's own integrity, and the source commit is the release tag's. This pull request's own repro-regression run stages the new package and re-runs every formicarium recipe on it, and the pull request merges itself once the required checks pass."
            echo
            echo "- If staging fails, the release moved or renamed something \`stage-formicarium-assets.ts\` expects (\`BUNDLE_ENTRIES\`): adapt the stager and the recipe driver on this branch."
            echo "- If a verdict flips, the runtime changed underneath the recipe; check the recipe page before merging by hand."
            echo "- Fix the recipe on this branch; once the branch differs from what the bot last pushed, the nightly run leaves it alone."
          } > "${RUNNER_TEMP}/body.md"
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Get an aletheia-works-bot token
        if: steps.bump.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update the pull request
        if: steps.bump.outputs.changed == 'true'
        uses: ./.github/actions/bot-pull-request
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/bump-formicarium
          title: ${{ steps.bump.outputs.title }}
          body-path: ${{ runner.temp }}/body.md

name: upstream-bump

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-bump
  cancel-in-progress: false

jobs:
  recipes:
    name: list recipes with an upstream pin
    if: github.repository_owner == 'aletheia-works' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      slugs: ${{ steps.list.outputs.slugs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise (bun, jq)
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install: true
          cache: true
          experimental: true
          install_args: bun jq

      - name: List them
        id: list
        working-directory: src/layer1_wasm
        run: |
          set -euo pipefail
          echo "slugs=$(bun run scripts/bump-upstream.ts --list | jq -Rnc '[inputs | select(length > 0)]')" >> "${GITHUB_OUTPUT}"

  bump:
    name: bump ${{ matrix.slug }}
    needs: recipes
    if: needs.recipes.outputs.slugs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJSON(needs.recipes.outputs.slugs) }}
    env:
      SLUG: ${{ matrix.slug }}
    steps:
      - name: Get an aletheia-works-bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise (bun, jq)
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install: true
          cache: true
          experimental: true
          install_args: bun jq

      - name: Move the pin to the latest release
        id: bump
        run: |
          set -euo pipefail
          (cd src/layer1_wasm && bun run scripts/bump-upstream.ts "${SLUG}") > "${RUNNER_TEMP}/bump.md"
          if git diff --quiet; then
            echo "${SLUG} is already on the latest upstream release."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          cat "${RUNNER_TEMP}/bump.md" >> "${GITHUB_STEP_SUMMARY}"
          version="$(jq -r '.upstream.version' "src/layer1_wasm/${SLUG}/recipe.json")"
          echo "title=chore(wasm): bump the ${SLUG} baseline to ${version}" >> "${GITHUB_OUTPUT}"
          {
            cat "${RUNNER_TEMP}/bump.md"
            echo
            echo "This pull request's own repro-regression run re-checks the recipe on the new release, and the pull request merges itself once the required checks pass."
            echo
            echo "- If the verdict flips to unreproduced, the bug is fixed upstream: retire the recipe or point it at the last release that still reproduces, rather than reverting this pin."
            echo "- If the build fails instead, something the recipe applies to the upstream source (a patch, a build step) no longer fits the new release. Fix the recipe on this branch; once the branch differs from what the bot last pushed, the nightly run leaves it alone."
            echo "- The fix-candidate pane is not rebuilt here, so until it is, the two panes may run different upstream bases."
          } > "${RUNNER_TEMP}/body.md"
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Open or update the pull request
        if: steps.bump.outputs.changed == 'true'
        uses: ./.github/actions/bot-pull-request
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/bump-upstream-${{ matrix.slug }}
          title: ${{ steps.bump.outputs.title }}
          body-path: ${{ runner.temp }}/body.md

name: deploy-docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/layer1_wasm/**'
      - 'src/layer2_docker/**'
      - 'mise.toml'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository_owner == 'aletheia-works' || vars.VIVARIUM_FORK_DEPLOY == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # for `lastUpdated` timestamps

      - name: Setup mise (bun, uv, jq)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true
          experimental: true
          install_args: bun uv jq

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install ajv-cli for verdict schema validation
        run: |
          BUN="$(mise which bun)"
          cd "$RUNNER_TEMP"
          "$BUN" init -y >/dev/null
          "$BUN" add ajv-cli@5 ajv-formats
          echo "AJV_BIN=$RUNNER_TEMP/node_modules/.bin/ajv" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Build docs (mise run docs:build)
        working-directory: ${{ github.workspace }}
        run: mise run docs:build

      - name: Build Layer 1 reproductions (mise run repro:build)
        working-directory: ${{ github.workspace }}
        run: mise run repro:build

      - name: Regenerate Japanese reproduction pages (mise run repro:i18n)
        working-directory: ${{ github.workspace }}
        run: mise run repro:i18n

      - name: Drop Rust build artefacts before bundling
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          find src/layer1_wasm -type d -name target -prune -exec rm -rf {} +

      - name: Resolve which Layer 2 recipes changed
        id: layer2-changed
        if: github.repository_owner == 'aletheia-works'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          zero='0000000000000000000000000000000000000000'
          if [ "$EVENT_NAME" != 'push' ] || [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "$zero" ]; then
            echo 'slugs=*' >>"$GITHUB_OUTPUT"
            echo "No base commit to compare against (event=${EVENT_NAME}); republishing every recipe."
            exit 0
          fi
          if ! files="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BEFORE_SHA}...${GITHUB_SHA}" \
            --paginate --jq '.files[].filename')"; then
            echo 'slugs=*' >>"$GITHUB_OUTPUT"
            echo "::warning::compare API failed; republishing every recipe."
            exit 0
          fi
          slugs="$(printf '%s\n' "$files" \
            | sed -n 's#^src/layer2_docker/\([^/]*\)/.*#\1#p' \
            | sort -u | tr '\n' ' ')"
          echo "slugs=${slugs}" >>"$GITHUB_OUTPUT"
          echo "Changed Layer 2 recipes: ${slugs:-(none)}"

      - name: Log in to GHCR (for Layer 2 image push)
        if: github.repository_owner == 'aletheia-works'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish changed Layer 2 images and snapshot every verdict
        if: github.repository_owner == 'aletheia-works'
        working-directory: ${{ github.workspace }}
        env:
          IMAGE_OWNER: aletheia-works
          CHANGED_SLUGS: ${{ steps.layer2-changed.outputs.slugs }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          recipes_index=docs/site/public/api/recipes.json
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          recipe_field() {
            value="$(jq -r --arg s "$1" \
              ".recipes[] | select(.slug == \$s) | .$2" \
              "$recipes_index")"
            if [ -z "$value" ] || [ "$value" = 'null' ]; then
              echo "::error::${1} has no ${2} in ${recipes_index}" >&2
              return 1
            fi
            printf '%s' "$value"
          }

          recipe_changed() {
            case "$CHANGED_SLUGS" in
              '*') return 0 ;;
            esac
            case " $CHANGED_SLUGS " in
              *" $1 "*) return 0 ;;
            esac
            return 1
          }

          repo_digest() {
            docker inspect --format='{{index .RepoDigests 0}}' "$1" 2>/dev/null || echo ''
          }

          pull_published() {
            for attempt in 1 2 3; do
              if docker pull "$1"; then
                return 0
              fi
              echo "docker pull $1 failed (attempt ${attempt}/3)"
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 5))
              fi
            done
            return 1
          }

          published_state() {
            manifest_accept='application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json'
            token="$(curl -sS -u "${GITHUB_ACTOR}:${GITHUB_TOKEN}" \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${IMAGE_OWNER}/vivarium-$1:pull" \
              | jq -r '.token // empty' || true)"
            if [ -z "$token" ]; then
              echo "vivarium-$1: no registry token issued" >&2
              echo unknown
              return
            fi
            code="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $token" \
              -H "Accept: ${manifest_accept}" \
              "https://ghcr.io/v2/${IMAGE_OWNER}/vivarium-$1/manifests/latest" || true)"
            echo "vivarium-$1: manifest HTTP ${code}" >&2
            case "$code" in
              200) echo present ;;
              404) echo absent ;;
              *) echo unknown ;;
            esac
          }

          for dockerfile in src/layer2_docker/*/Dockerfile; do
            slug_dir="$(dirname "$dockerfile")"
            slug="$(basename "$slug_dir")"
            case "$slug" in _*) continue ;; esac
            tag_latest="ghcr.io/${IMAGE_OWNER}/vivarium-${slug}:latest"
            tag_sha="ghcr.io/${IMAGE_OWNER}/vivarium-${slug}:${GITHUB_SHA}"

            if ! recipe_changed "$slug"; then
              case "$(published_state "$slug")" in
                present)
                  echo "Unchanged: ${slug} - capturing against the published ${tag_latest}"
                  if ! pull_published "$tag_latest"; then
                    echo "::error::${tag_latest} is published but could not be pulled. Refusing to rebuild an unchanged recipe: that would move :latest and force every visitor to re-pull."
                    exit 1
                  fi
                  bash scripts/capture_layer2_verdict.sh \
                    "$tag_latest" "${slug_dir}/verdict.json" \
                    --image-tag "$tag_latest" \
                    --image-digest "$(repo_digest "$tag_latest")"
                  continue
                  ;;
                absent)
                  echo "::warning::${tag_latest} has never been published; publishing ${slug} now."
                  ;;
                *)
                  echo "::error::Cannot tell whether ${tag_latest} is published. Refusing to rebuild an unchanged recipe: that would move :latest and force every visitor to re-pull."
                  exit 1
                  ;;
              esac
            fi

            description="$(recipe_field "$slug" title)"
            page_url="$(recipe_field "$slug" page_url)"
            labels=(
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
              --label "org.opencontainers.image.revision=${GITHUB_SHA}"
              --label "org.opencontainers.image.version=${GITHUB_SHA}"
              --label "org.opencontainers.image.created=${built_at}"
              --label "org.opencontainers.image.title=vivarium-${slug}"
              --label "org.opencontainers.image.description=${description}"
              --label "org.opencontainers.image.url=${page_url}"
              --label "org.opencontainers.image.documentation=${page_url}"
              --label "org.opencontainers.image.licenses=Apache-2.0"
            )

            echo "Building Layer 2 image: ${slug}"
            docker build "${labels[@]}" --tag "$tag_latest" "$slug_dir"

            echo "Pushing ${tag_latest} to GHCR"
            docker push "$tag_latest"
            verdict_tag="$tag_latest"

            if recipe_changed "$slug"; then
              echo "Pushing ${tag_sha} to GHCR"
              docker tag "$tag_latest" "$tag_sha"
              docker push "$tag_sha"
              verdict_tag="$tag_sha"
            fi

            bash scripts/capture_layer2_verdict.sh \
              "$tag_latest" "${slug_dir}/verdict.json" \
              --image-tag "$verdict_tag" \
              --image-digest "$(repo_digest "$verdict_tag")"
          done

      - name: Bundle Layer 1 reproductions alongside docs
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          dest="docs/doc_build/repro"
          ja_dest="docs/doc_build/ja/repro"
          if [ ! -d src/layer1_wasm ]; then
            echo "No src/layer1_wasm/ directory; skipping bundling."
            exit 0
          fi
          mkdir -p "$dest"
          pages_prefix="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY##*/}/repro/"
          layer1_projects="$(jq -r '.recipes[] | select(.layer == 1) | .project' \
            docs/site/public/api/recipes.json | sort -u)"
          for project in $layer1_projects; do
            mkdir -p "$dest/$project"
            for shared in src/layer1_wasm/_*/; do
              [ -d "$shared" ] || continue
              shared_name="$(basename "$shared")"
              echo "Staging Layer 1 shared module: ${shared_name} → ${dest}/${project}/${shared_name}"
              cp -R "${shared%/}" "$dest/$project/$shared_name"
            done
          done
          for recipe in src/layer1_wasm/*/; do
            slug="$(basename "$recipe")"
            case "$slug" in
              _*)
                continue
                ;;
            esac
            if [ ! -f "${recipe}index.html" ]; then
              echo "Skipping ${recipe} (no index.html)"
              continue
            fi
            page_url="$(jq -r --arg s "$slug" \
              '.recipes[] | select(.slug == $s) | .page_url' \
              docs/site/public/api/recipes.json)"
            if [ -z "$page_url" ] || [ "$page_url" = "null" ]; then
              echo "ERROR: ${slug} not found in docs/site/public/api/recipes.json"
              exit 1
            fi
            rel="${page_url#"${pages_prefix}"}"
            rel="${rel%/}"
            echo "Bundling reproduction: ${slug} → ${dest}/${rel}/"
            mkdir -p "$dest/$rel"
            cp -R "${recipe}." "$dest/$rel/"
            if [ -f "${recipe}index.ja.html" ]; then
              echo "Bundling JA reproduction: ${slug} → ${ja_dest}/${rel}/"
              mkdir -p "$ja_dest/$rel"
              cp "${recipe}index.ja.html" "$ja_dest/$rel/index.html"
              rm -f "$dest/$rel/index.ja.html"
            fi
          done
          ls -la "$dest" || true

      - name: Bundle Layer 2 reproductions alongside docs
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          dest="docs/doc_build/repro"
          ja_dest="docs/doc_build/ja/repro"
          if [ ! -d src/layer2_docker ]; then
            echo "No src/layer2_docker/ directory; skipping Layer 2 bundling."
            exit 0
          fi
          shopt -s nullglob
          mkdir -p "$dest"
          pages_prefix="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY##*/}/repro/"
          layer2_projects="$(jq -r '.recipes[] | select(.layer == 2) | .project' \
            docs/site/public/api/recipes.json | sort -u)"
          for project in $layer2_projects; do
            mkdir -p "$dest/$project"
            for shared in src/layer2_docker/_*/; do
              [ -d "$shared" ] || continue
              shared_name="$(basename "$shared")"
              case "$shared_name" in _template|_assets|_shared) continue ;; esac
              echo "Staging Layer 2 shared module: ${shared_name} → ${dest}/${project}/${shared_name}"
              cp -R "${shared%/}" "$dest/$project/$shared_name"
            done
            if [ -d "src/layer1_wasm/_shared" ]; then
              echo "Staging Layer 1 _shared/ for Layer 2 project: ${dest}/${project}/_shared"
              cp -R "src/layer1_wasm/_shared" "$dest/$project/_shared"
            fi
            if [ -d "src/layer1_wasm/_assets" ]; then
              echo "Staging Layer 1 _assets/ for Layer 2 project: ${dest}/${project}/_assets"
              cp -R "src/layer1_wasm/_assets" "$dest/$project/_assets"
            fi
          done
          for entry in src/layer2_docker/*/; do
            slug="$(basename "$entry")"
            case "$slug" in
              _*)
                continue
                ;;
            esac
            if [ ! -f "${entry}Dockerfile" ]; then
              echo "Skipping ${entry} (no Dockerfile)"
              continue
            fi
            page_url="$(jq -r --arg s "$slug" \
              '.recipes[] | select(.slug == $s) | .page_url' \
              docs/site/public/api/recipes.json)"
            if [ -z "$page_url" ] || [ "$page_url" = "null" ]; then
              echo "ERROR: ${slug} not found in docs/site/public/api/recipes.json"
              exit 1
            fi
            rel="${page_url#"${pages_prefix}"}"
            rel="${rel%/}"
            echo "Bundling Layer 2 reproduction: ${slug} → ${dest}/${rel}/"
            mkdir -p "$dest/$rel"
            cp -R "${entry}." "$dest/$rel/"
            if [ -f "${entry}index.ja.html" ]; then
              echo "Bundling JA reproduction: ${slug} → ${ja_dest}/${rel}/"
              mkdir -p "$ja_dest/$rel"
              cp "${entry}index.ja.html" "$ja_dest/$rel/index.html"
              rm -f "$dest/$rel/index.ja.html"
            fi
          done
          ls -la "$dest" || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/doc_build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

name: deploy-docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/layer1_wasm/**'
      - 'src/layer2_docker/**'
      - 'mise.toml'
      - 'mise-tasks/**'
      - 'scripts/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository_owner == 'aletheia-works' || vars.VIVARIUM_FORK_DEPLOY == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # for `lastUpdated` timestamps
          persist-credentials: false

      - name: Setup mise (bun, uv, jq, jsonschema)
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install: true
          cache: true
          experimental: true
          install_args: bun uv jq jsonschema

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build docs (mise run docs:build)
        working-directory: ${{ github.workspace }}
        run: mise run docs:build

      - name: Build Layer 1 reproductions (mise run repro:build)
        working-directory: ${{ github.workspace }}
        run: mise run repro:build

      - name: Regenerate Japanese reproduction pages (mise run repro:i18n)
        working-directory: ${{ github.workspace }}
        run: mise run repro:i18n

      - name: Stage formicarium assets (pin mode)
        working-directory: ${{ github.workspace }}
        timeout-minutes: 7
        run: bun docs/scripts/stage-formicarium-assets.ts --mode pin

      - name: Drop Rust build artefacts before bundling
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          find src/layer1_wasm -type d -name target -prune -exec rm -rf {} +

      - name: Resolve which Layer 2 recipes changed
        id: layer2-changed
        if: github.repository_owner == 'aletheia-works'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: bash scripts/resolve-changed-layer2-recipes.sh

      - name: Log in to GHCR (for Layer 2 image push)
        if: github.repository_owner == 'aletheia-works'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish changed Layer 2 images and snapshot every verdict
        if: github.repository_owner == 'aletheia-works'
        working-directory: ${{ github.workspace }}
        env:
          IMAGE_OWNER: aletheia-works
          CHANGED_SLUGS: ${{ steps.layer2-changed.outputs.slugs }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-layer2-images.sh

      - name: Bundle Layer 1 reproductions alongside docs
        working-directory: ${{ github.workspace }}
        run: bash scripts/bundle-layer1-pages.sh

      - name: Bundle Layer 2 reproductions alongside docs
        working-directory: ${{ github.workspace }}
        run: bash scripts/bundle-layer2-pages.sh

      - name: Check the site size, coi-serviceworker copies and formicarium bundles
        working-directory: ${{ github.workspace }}
        run: bun docs/scripts/stage-formicarium-assets.ts --mode check-site --site docs/doc_build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/doc_build
          # Recipe fixtures ship dotfiles (fixture/.prettierrc); the action
          # still drops .git and .github.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

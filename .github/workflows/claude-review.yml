name: Claude Review

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    uses: aletheia-works/.github/.github/workflows/claude-review.yml@b24ce77ad773bcca239d8140aeb373f295572521 # v1.3.1
    with:
      rules: >-
        AGENTS.md, .claude/rules/, the README.md nearest the changed code, and any spec page under docs/site/*/spec/
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

name: Claude Review

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    uses: aletheia-works/.github/.github/workflows/claude-review.yml@f5bb52fe38d6ddf151662ed6b64c0b23eeb50ec4 # v1.3.3
    with:
      rules: >-
        AGENTS.md, .claude/rules/, the README.md nearest the changed code, and any spec page under docs/site/*/spec/
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

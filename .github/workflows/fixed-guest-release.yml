name: fixed-guest-release

run-name: release build run ${{ inputs.build_run_id }}

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Run ID of the fixed-guest-build run that holds the set
        required: true
        type: string
  workflow_call:
    inputs:
      build_run_id:
        required: true
        type: string

permissions: {}

concurrency:
  group: fixed-guest-release
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare
    if: github.repository == 'aletheia-works/vivarium' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      plan_sha256: ${{ steps.plan.outputs.plan_sha256 }}
    env:
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise (bun)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install: true
          cache: true
          experimental: true
          install_args: bun

      - name: Install the builder's locked dependencies
        working-directory: tools/fixed-guest-builder
        run: bun install --frozen-lockfile

      - name: Fetch the build run's set
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fixed-guest-${{ inputs.build_run_id }}
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/fgb-in

      - name: Make the plan
        id: plan
        working-directory: tools/fixed-guest-builder
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/fgb-plan"
          bun run src/cli.ts prepare \
            --build-run-id "${BUILD_RUN_ID}" \
            --artifacts "${RUNNER_TEMP}/fgb-in" \
            --plan-out "${RUNNER_TEMP}/fgb-plan/plan.json" \
            --summary "${GITHUB_STEP_SUMMARY}" \
            > "${RUNNER_TEMP}/prepare.json"
          sha="$(jq -r .planSha256 "${RUNNER_TEMP}/prepare.json")"
          echo "plan_sha256=${sha}" >> "${GITHUB_OUTPUT}"

      - name: Keep the plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixed-guest-plan
          path: ${{ runner.temp }}/fgb-plan/plan.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish:
    name: publish
    needs: prepare
    if: github.repository == 'aletheia-works/vivarium' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: fixed-guest-release
    permissions:
      contents: write
      actions: read
    env:
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      PLAN_SHA256: ${{ needs.prepare.outputs.plan_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise (bun)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install: true
          cache: true
          experimental: true
          install_args: bun

      - name: Install the builder's locked dependencies
        working-directory: tools/fixed-guest-builder
        run: bun install --frozen-lockfile

      - name: Fetch the build run's set
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fixed-guest-${{ inputs.build_run_id }}
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/fgb-in

      - name: Fetch the plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fixed-guest-plan
          path: ${{ runner.temp }}/fgb-plan

      - name: Publish under the approved plan
        working-directory: tools/fixed-guest-builder
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bun run src/cli.ts release \
            --workflow fixed-guest-release.yml \
            --build-run-id "${BUILD_RUN_ID}" \
            --artifacts "${RUNNER_TEMP}/fgb-in" \
            --plan "${RUNNER_TEMP}/fgb-plan/plan.json" \
            --plan-sha256 "${PLAN_SHA256}"

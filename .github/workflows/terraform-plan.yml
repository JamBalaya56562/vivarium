name: Terraform Plan

on:
  pull_request_target:
    paths:
      - 'infra/github/**'
      - '.github/workflows/terraform-plan.yml'

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  plan:
    if: github.repository_owner == 'aletheia-works'
    uses: aletheia-works/.github/.github/workflows/terraform-plan.yml@f8efae13d9ff4ea96692f7feac3cfdc4a7add308 # main
    with:
      working_directory: infra/github
      tfvar_assignments: |
        create_phase_milestones=true
    secrets: inherit

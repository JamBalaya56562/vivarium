name: Test docs (unit + build + E2E)

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/layer1_wasm/_assets/**'
      - '.github/workflows/test-docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/layer1_wasm/_assets/**'
      - '.github/workflows/test-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit (resolveReproFile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install + unit test
        run: |
          bun install --frozen-lockfile
          bun run test:unit

  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright system packages (${{ matrix.browser }})
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vivarium-pw-apt
          key: pw-apt-${{ runner.os }}-${{ env.ImageOS }}-${{ matrix.browser }}-${{ hashFiles('docs/bun.lock') }}

      - name: Install Playwright browser (${{ matrix.browser }})
        run: |
          set -euo pipefail
          cache_dir="$HOME/.cache/vivarium-pw-apt"
          mkdir -p "$cache_dir/partial"
          chmod -R a+rwX "$cache_dir"
          printf 'Dir::Cache::archives "%s";\n' "$cache_dir" \
            | sudo tee /etc/apt/apt.conf.d/99-vivarium-pw-cache > /dev/null

          bunx playwright install --with-deps ${{ matrix.browser }}

          sudo chown -R "$(id -u):$(id -g)" "$cache_dir"
          rm -rf "$cache_dir/partial" "$cache_dir/lock"
          echo "Cached $(find "$cache_dir" -maxdepth 1 -name '*.deb' | wc -l) .deb(s)."

      - name: Run Playwright suite (${{ matrix.browser }})
        run: bun run test:e2e -- --project=${{ matrix.browser }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.browser }}
          path: docs/playwright-report/
          retention-days: 7

target-version = "py313"

line-length = 100

include = ["src/layer1_wasm/*/repro.py", "docs/scripts/**/*.py"]
extend-exclude = [
  "**/node_modules/**",
  "**/dist/**",
  "**/target/**",
  "**/doc_build/**",
  "**/.venv/**",
]

[lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501",
]

[format]
quote-style = "double"

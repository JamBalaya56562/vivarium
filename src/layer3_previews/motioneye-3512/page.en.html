<template data-slot="title">motionEye #3512 — the Google key through a loopback redirect</template>

<template data-slot="h1">motionEye #3512 — the Google key through a loopback redirect</template>

<template data-slot="lede">
  Google stopped the copy-and-paste flow motionEye used to get a Google
  Drive or Google Photos key. The pull request gets the key through a
  loopback redirect with PKCE, and explains the steps in a dialog before
  it opens Google.
</template>

<template data-slot="check">
  <ol>
    <li data-i18n="check.step1">Sign in as <code>admin</code> with the password <code>password</code>.</li>
    <li data-i18n="check.step2">In camera 1's <strong>File storage</strong>, turn on <strong>Upload Media Files</strong>
      and choose <strong>Google Drive</strong> as the <strong>Upload Service</strong>.</li>
    <li data-i18n="check.step3">Click <strong>Obtain key</strong>. A dialog, <strong>Obtaining the key from Google</strong>,
      lists three steps and a note that testing the upload with the new key
      replaces the current Google authorization, even before the settings are
      applied.</li>
    <li data-i18n="check.step4">Click <strong>Cancel</strong>: nothing opens. Click <strong>Obtain key</strong> again and
      <strong>OK</strong>: Google's sign-in page opens in a new tab. Stop there.
      Do not sign in or allow access: the key would land in this shared
      preview, which everyone let in can open.</li>
    <li data-i18n="check.step5">Choose <strong>Dropbox</strong> instead and click <strong>Obtain key</strong>: Dropbox opens
      directly, without the dialog.</li>
  </ol>
</template>

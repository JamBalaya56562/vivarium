<template data-slot="drawer-body">
  <p data-i18n="drawer.body.p1">When Prettier configuration omits <code>semi</code> and <code>singleQuote</code>, Prettier defaults to <code>true</code> and <code>false</code>. Biome's migration instead uses <code>false</code> and <code>true</code>, silently changing semicolons and quotes.</p>
  <p data-i18n="drawer.body.p2">Both isolated terminals start with the same <code>biome-migrate-prettier</code> fixture: <code>biome.json</code> and <code>.prettierrc</code> each contain <code>{}</code>. Both run <code>cat .prettierrc</code>, <code>cat biome.json</code>, <code>biome migrate prettier --write</code>, then <code>cat biome.json</code>. Read the actual generated configuration in each terminal.</p>
  <p data-i18n="drawer.body.p3">The baseline is the fix's parent, <a href="https://github.com/biomejs/biome/commit/2405c7620169bd0719166af09a8d89cc76fb37fb">2405c7620169bd0719166af09a8d89cc76fb37fb</a>. It matched upstream main when checked on 2026-10-11; this page runs that exact commit, rather than following main. The candidate is <a href="https://github.com/JamBalaya56562/biome/commit/374751ab0abab3f23ffb3f698392c0847421f0ec">374751ab0abab3f23ffb3f698392c0847421f0ec</a> from <a href="https://github.com/JamBalaya56562/biome/tree/fix/migrate-prettier-default-semi-quotes">JamBalaya56562's fix branch</a>.</p>
  <p data-i18n="drawer.body.p4">Before the fix, <code>javascript.formatter</code> has <code>semicolons: asNeeded</code> and <code>quoteStyle: single</code>. The candidate should produce <code>semicolons: always</code> and <code>quoteStyle: double</code>. Terrarium builds both unmodified source commits as static musl binaries and runs them in this tab. The verdict reports only the baseline; the candidate is checked separately. After the recorded session, you can type your own commands.</p>
</template>

<template data-slot="drawer-body">
  <p data-i18n="drawer.body.p1">A dependency's own <code>node_modules/.bin</code>, which aube puts on the <code>PATH</code> of that dependency's lifecycle scripts, gets the bins of the registry and <code>file:</code> dependencies it declares. The baseline skips the ones it declares with <code>link:</code>, so a build script that calls such a bin cannot find it.</p>
  <p data-i18n="drawer.body.p2">Both terminals start from the same fixture: <code>package.json</code> depends on <code>builder</code> through <code>file:./vendor/builder</code>, which depends on <code>linked-tool</code> through <code>link:../linked-tool</code>, and <code>linked-tool</code> declares the bin <code>linked-tool</code>. Both run <code>cat vendor/builder/package.json</code>, <code>aube install</code>, then <code>ls</code> on <code>builder</code>'s <code>node_modules</code> in the virtual store.</p>
  <p data-i18n="drawer.body.p3">Lifecycle scripts do not run here, so the page reads that listing instead. When it has a <code>.bin/</code> beside <code>builder/</code> and <code>linked-tool</code>, the terminal also lists <code>.bin</code>: <code>linked-tool</code> there is corrected, and anything else is reproduced. The verdict reports only the baseline; the fix is checked separately. After the recorded commands you can type your own.</p>
  <p data-i18n="drawer.body.p4">formicarium runs the accepted static musl builds of both commits in this tab, after checking each ELF and its build-info against the accepted digests.</p>
</template>

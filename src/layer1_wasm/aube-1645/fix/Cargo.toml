[package]
name = "aube-1645-fix-candidate"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "repro-fix"
path = "src/main.rs"

[dependencies]
aube-lockfile = { path = "../.aube/pr-1645/crates/aube-lockfile" }
aube-manifest = { path = "../.aube/pr-1645/crates/aube-manifest", default-features = false }
serde_json = "1.0.117"

[profile.release]
opt-level = "z"
strip = true
lto = true
panic = "abort"
codegen-units = 1

<template data-slot="script-heading">Reproduction script (Rust)</template>

<template data-slot="upstream-url">https://github.com/aubepkg/aube/pull/1645</template>

<template data-slot="drawer-body">
    <p data-i18n="drawer.body.p1">
      pnpm-format lockfiles such as <code>aube-lock.yaml</code>
      record where a <code>file:</code> or <code>link:</code>
      dependency lives, but not its version. aube's lockfile
      reader fills in <code>0.0.0</code>, so every command that
      reads the lockfile instead of resolving —
      <code>aube install --frozen-lockfile</code>,
      <code>--prod</code>, <code>aube list</code> — reports those
      packages as <code>0.0.0</code>, while a fresh resolve shows
      the version from their own <code>package.json</code>.
    </p>
    <p data-i18n="drawer.body.p2">
      The script writes a small project into an in-memory
      <code>/tmp</code>, hands it to aube's own lockfile reader
      compiled to <code>wasm32-wasip1</code>, and compares each
      local package's version in the result with the one in its
      <code>package.json</code>. The baseline pane runs aube v2.6.1,
      the latest release; the fix-candidate pane runs the head of
      the pull request that fixes the bug.
    </p>
    <p data-i18n="drawer.body.p3">
      Both builds compile aube from source with one patch, which
      keeps aube-util's network and async I/O code on native targets
      because it does not build for wasm. The lockfile reader under
      test is unchanged.
    </p>
</template>

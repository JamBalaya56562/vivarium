<template data-slot="drawer-body">
  <p data-i18n="drawer.body.p1">A Prettier configuration that sets <code>bracketSpacing: false</code> at its top level is migrated with <code>biome migrate prettier</code>. The baseline copies it only into <code>javascript.formatter</code> and leaves the top-level <code>formatter.bracketSpacing</code> at <code>true</code>, so JSON and the other languages that read it keep spaces inside their brackets.</p>
  <p data-i18n="drawer.body.p2">Both terminals start from the same fixture: <code>.prettierrc</code> holds <code>{"bracketSpacing":false}</code> and <code>biome.json</code> holds <code>{}</code>. Both run <code>cat .prettierrc</code>, <code>cat biome.json</code>, <code>biome migrate prettier --write</code>, then <code>cat biome.json</code>.</p>
  <p data-i18n="drawer.body.p3">The page reads the migrated top-level <code>formatter.bracketSpacing</code>: <code>false</code> is corrected, <code>true</code> is reproduced. The verdict reports only the baseline; the fix is checked separately. After the recorded commands you can type your own.</p>
  <p data-i18n="drawer.body.p4">formicarium runs the accepted static musl builds of both commits in this tab, after checking each ELF and its build-info against the accepted digests.</p>
